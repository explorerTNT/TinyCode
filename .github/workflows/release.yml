name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: resolve
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          # A tag push releases exactly that tag, no computation needed.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing tag ${GITHUB_REF_NAME}"
            exit 0
          fi

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            base="0.0.0"
            range=""
            echo "No previous tag found; starting from ${base}"
          else
            base="${latest#v}"
            range="${latest}..HEAD"
            echo "Previous tag: ${latest}"
          fi

          major="$(echo "${base}" | cut -d. -f1)"
          minor="$(echo "${base}" | cut -d. -f2)"
          patch="$(echo "${base}" | cut -d. -f3)"

          count="$(git rev-list --count ${range:+$range} HEAD)"
          if [ "${count}" -eq 0 ]; then
            echo "No new commits since ${latest}; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects="$(git log --format='%s' ${range:+$range})"
          bodies="$(git log --format='%B' ${range:+$range})"

          bump="${BUMP}"
          if [ "${bump}" = "auto" ]; then
            if printf '%s\n' "${subjects}" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
              || printf '%s\n' "${bodies}" | grep -qE '^BREAKING[ -]CHANGE'; then
              bump="major"
            elif printf '%s\n' "${subjects}" | grep -qE '^feat(\([^)]*\))?:'; then
              bump="minor"
            elif printf '%s\n' "${subjects}" | grep -qE '^(fix|perf|refactor)(\([^)]*\))?:'; then
              bump="patch"
            else
              bump="none"
            fi
          fi
          echo "Detected bump: ${bump} (over ${count} commit(s))"

          case "${bump}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            none)
              echo "Only non-releasable commits (docs/chore/ci/test); skipping release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          version="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Next version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="tiny-code_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "build/${name}" dist

          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "build/${name}/tiny-code${{ matrix.ext }}" .
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "build/${name}/tiny-code-benchmark${{ matrix.ext }}" ./cmd/benchmark

          cp README.md LICENSE.md "build/${name}/"

          if [ "${GOOS}" = "windows" ]; then
            (cd build && zip -qr "../dist/${name}.zip" "${name}")
          else
            tar -czf "dist/${name}.tar.gz" -C build "${name}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: dist/*
